<!DOCTYPE html>
<html>
<head>
  <title>Voice Chat</title>
  <style>
    body { text-align: center; font-family: sans-serif; background: #111; color: #eee; }
    #mic { padding: 15px 30px; font-size: 18px; margin-top: 20px; cursor: pointer; }
    canvas { display: block; margin: 30px auto; background: #000; border-radius: 10px; }
    #transcript, #answer { max-width: 600px; margin: 10px auto; }
  </style>
</head>
<body>
  <button id="mic">🎤 Hold to talk</button>
  <canvas id="viz" width="500" height="150"></canvas>
  <p id="transcript"></p>
  <p id="answer"></p>

  <script>
    const canvas = document.getElementById("viz");
    const ctx = canvas.getContext("2d");
    let audioContext, analyser, dataArray, source, animationId;

    async function setupVisualizer() {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      audioContext = new AudioContext();
      analyser = audioContext.createAnalyser();
      analyser.fftSize = 64;
      source = audioContext.createMediaStreamSource(stream);
      source.connect(analyser);
      dataArray = new Uint8Array(analyser.frequencyBinCount);
      draw();
    }

    function draw() {
      animationId = requestAnimationFrame(draw);
      analyser.getByteFrequencyData(dataArray);
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      const barWidth = canvas.width / dataArray.length;
      ctx.fillStyle = "#4ade80";
      dataArray.forEach((value, i) => {
        const height = (value / 255) * canvas.height;
        ctx.fillRect(i * barWidth, canvas.height - height, barWidth - 2, height);
      });
    }

    function stopVisualizer() {
      if (animationId) cancelAnimationFrame(animationId);
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      if (audioContext) audioContext.close();
    }

    const recognition = new webkitSpeechRecognition();
    recognition.lang = "en-US";

    recognition.onresult = async (event) => {
      const question = event.results[0][0].transcript;
      document.getElementById("transcript").innerText = "You said: " + question;

      const res = await fetch("/ask/", {
        method: "POST",
        body: JSON.stringify({question})
      });
      const data = await res.json();
      document.getElementById("answer").innerText = data.answer;

      const speakRes = await fetch("/speak/", {
        method: "POST",
        body: JSON.stringify({text: data.answer})
      });
      const audioBlob = await speakRes.blob();
      const audioUrl = URL.createObjectURL(audioBlob);
      const audio = new Audio(audioUrl);
      audio.play();
    };

    recognition.onend = stopVisualizer;

    document.getElementById("mic").onclick = () => {
      setupVisualizer();
      recognition.start();
    };
  </script>
</body>
</html>
